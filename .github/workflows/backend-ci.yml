name: Backend CI

on:
  push:
    branches: [main, master, 'checkpoint/**']
  pull_request:

jobs:
  test-build-audit:
    runs-on: ubuntu-latest

    # PostgreSQL only. The product runs on PostgreSQL, so CI must exercise the
    # same engine: SQLite silently accepts types, NULLs and constraint
    # violations that PostgreSQL rejects, so a SQLite CI run hides real
    # production failures. The connection string points at the service below,
    # created fresh for each job and destroyed with it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: LmsTestOnly_2026
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lms_test:LmsTestOnly_2026@localhost:5432/lms_test?schema=public
      TEST_DATABASE_URL: postgresql://lms_test:LmsTestOnly_2026@localhost:5432/lms_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-chars
      ALLOWED_ORIGINS: http://localhost:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Proves the production migration path works against an empty database.
      # This is intentionally separate from the test run: `db push` is used by
      # globalSetup for speed, so without this step a broken migration.sql would
      # never be noticed.
      - name: Verify migrations apply to an empty PostgreSQL database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify the production image builds
        run: docker build -t lms-backend:ci .
